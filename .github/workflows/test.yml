name: Tests

on:
  push:
    branches: [ main, develop ]
  # Run on every PR regardless of its base branch, so a stacked PR (one based on
  # another feature branch, not main/develop) still gets CI. Push CI stays scoped to
  # the long-lived branches above.
  pull_request:

# One in-flight run per pull request. Pushing a fixup used to leave the
# previous run going to completion -- a full duplicate set of jobs holding
# concurrency slots to test a commit nobody was waiting on any more.
# Pushes to main are never cancelled: every commit that lands gets tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # First entry is the floor named in go.mod (1.26, the oldest
        # release upstream still supports); testing there is what keeps
        # that floor honest. Last entry is the newest release, which is
        # what builds and ships. Everything below 1.26 is end of life.
        go-version: ['1.26', '1.27']

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        check-latest: true
        go-version: ${{ matrix.go-version }}

    - name: Install goyacc (version pinned in .github/tools)
      # Built from .github/tools, where the version is pinned and recorded
      # in that module's go.sum. `go install ...@latest` fetched whatever
      # had just been published and verified it against nothing -- a parser
      # generator running with full access to the build. Dependabot bumps
      # it there, under the configured cooldown.
      #
      # GOTOOLCHAIN=auto because x/tools may require a newer Go than the
      # matrix entry building it; the tests below still run on the matrix
      # Go under the inherited GOTOOLCHAIN=local.
      env:
        GOTOOLCHAIN: auto
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        (cd .github/tools && GOWORK=off go build -o "$RUNNER_TEMP/bin/goyacc" golang.org/x/tools/cmd/goyacc)
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Generate parser
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        goyacc -o parser/y.go -p yy parser/classad.y

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -v ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage to Codecov
      if: matrix.go-version == '1.27'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  # collections/ is a separate Go module (its own go.mod, go 1.26) — the dense
  # ClassAd store + query engine, the persistent/archive variants, and their tests.
  # The root module's `go test ./...` does not descend into a nested module, so it
  # gets its own job (and a newer toolchain than the root matrix).
  #
  # The suite is SHARDED by test name across parallel jobs. Every test here is `package
  # collections`, so there is one test binary and `go test -p` (which parallelizes across
  # packages) has nothing to work with: ~55 minutes of runner time under -race. Tests do
  # overlap within a shard -- 71% of the recorded time calls t.Parallel() -- but that is
  # bounded by the cores one runner has, which is what sharding adds to. The shards give it the cores one runner does not have, with no test
  # skipped and the race detector still on everywhere. Tests are packed by their recorded
  # durations (collections/shard-durations.txt), so each shard gets about the same time.
  # Four shards balanced by test COUNT left one at 19-25 minutes and it hit the 25m
  # timeout. To add a shard, add its index below: the script reads the shard count from
  # the matrix. See collections/shard-test.sh.
  collections:
    name: Collections shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports: one shard failing must not hide a second failure elsewhere.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        check-latest: true
        go-version: '1.27'

    - name: Install goyacc (version pinned in .github/tools)
      # Built from .github/tools, where the version is pinned and recorded
      # in that module's go.sum. `go install ...@latest` fetched whatever
      # had just been published and verified it against nothing -- a parser
      # generator running with full access to the build. Dependabot bumps
      # it there, under the configured cooldown.
      #
      # GOTOOLCHAIN=auto because x/tools may require a newer Go than the
      # matrix entry building it; the tests below still run on the matrix
      # Go under the inherited GOTOOLCHAIN=local.
      env:
        GOTOOLCHAIN: auto
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        (cd .github/tools && GOWORK=off go build -o "$RUNNER_TEMP/bin/goyacc" golang.org/x/tools/cmd/goyacc)
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Generate parser
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        goyacc -o parser/y.go -p yy parser/classad.y

    - name: Build and vet
      working-directory: collections
      run: |
        go mod download
        go build ./...
        go vet ./...

    # Tests parallelize via t.Parallel(), so each shard also scales across its own runner's
    # cores; the race detector's ~5-10x memory is bounded because the few heaviest tests are
    # sized to a few thousand ads. The script prints its shard sizes and refuses to run a
    # partition that would drop or duplicate a test. SHARDS comes from the matrix size, so
    # the shard list above is the only place the count is written down.
    - name: Test (race detector)
      working-directory: collections
      env:
        SHARD: ${{ matrix.shard }}
        SHARDS: ${{ strategy.job-total }}
      run: ./shard-test.sh

  # A single check that stays green/red for the whole sharded suite, so a required status
  # check (and anyone reading the PR) has one "Collections module" result to look at rather
  # than one per shard. Without it, adding or removing a shard silently changes which checks exist.
  collections-result:
    name: Collections module
    needs: collections
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check shard results
      env:
        RESULT: ${{ needs.collections.result }}
      run: |
        echo "shards: $RESULT"
        # 'success' only when every matrix job succeeded; skipped/cancelled count as failure
        # here, because a suite that did not run is not a suite that passed.
        [ "$RESULT" = "success" ] || exit 1

  # The width-native SIMD kernels (collections/vm/simdengine_amd64.go and
  # simdengine_arm64.go) sit behind //go:build goexperiment.simd. Nothing else in
  # this workflow sets GOEXPERIMENT, so until this job existed they compiled in NO
  # CI run at all: both engines, every column width, and the arm64 movemask
  # emulation were verified only by whoever happened to build with the experiment
  # locally. The differential test that compares those kernels against the scalar
  # ones could not fail, because the configuration it tests was never built.
  #
  # Deliberately ONE job and not a shard matrix. Every tagged file lives in
  # collections/vm, which is small enough to run whole under -race in well under a
  # minute; the rest of the module is unaffected by the tag and the sharded job
  # above already covers it. Building the whole module is still worth doing as a
  # compile check, because a tagged file that stops compiling is the failure mode.
  #
  # ubuntu-latest is amd64, which makes this the only place the amd64 engine runs
  # at all: 32-lane AVX2 with a free Mask.ToBits, against arm64's 16 lanes and a
  # two-reduction movemask emulation. Development on this project happens on arm64.
  simd:
    name: SIMD engine
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        check-latest: true
        # simd/archsimd needs 1.27 on arm64. amd64 would take 1.26, but both
        # engines are held to one toolchain so a failure here is never "which Go".
        go-version: '1.27'

    - name: Install goyacc (version pinned in .github/tools)
      env:
        GOTOOLCHAIN: auto
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        (cd .github/tools && GOWORK=off go build -o "$RUNNER_TEMP/bin/goyacc" golang.org/x/tools/cmd/goyacc)
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Generate parser
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        goyacc -o parser/y.go -p yy parser/classad.y

    - name: Build and vet with the engine compiled in
      working-directory: collections
      env:
        GOEXPERIMENT: simd
      run: |
        go mod download
        go build ./...
        go vet ./...

    # This is NOT redundant with the test it runs. On a toolchain that supports the
    # experiment, TestSIMDEngineTurnsOnByItself PASSES when no engine is compiled
    # in -- it only fails past the Go minor it was last verified against. So if
    # GOEXPERIMENT ever stopped taking effect (a toolchain change, or the tag
    # graduating) every test below would still pass while quietly exercising the
    # scalar path: a green job testing the opposite of what its name claims, which
    # is the blindness this job exists to remove. Assert the engine is in.
    - name: Assert an engine is actually compiled in
      working-directory: collections
      env:
        GOEXPERIMENT: simd
      run: |
        set -o pipefail
        go test ./vm/ -run TestSIMDEngineTurnsOnByItself -count=1 -v 2>&1 | tee "$RUNNER_TEMP/engine.log"
        grep -q 'engine compiled in = true' "$RUNNER_TEMP/engine.log" || {
          echo "::error::GOEXPERIMENT=simd compiled no engine in; this job would be testing the scalar path."
          exit 1
        }

    - name: Test collections/vm with the engine (race detector)
      working-directory: collections
      env:
        GOEXPERIMENT: simd
      run: go test -race -count=1 ./vm/...

    # The kernels only matter through a query, and this is the one check that runs
    # the aggregate fast paths against the record scan as reference with the engine
    # active -- the comparison kernels are the part a wrong answer would come from.
    # The fuzz workflow deliberately runs WITHOUT the experiment, because that is
    # what production ships, so this is the other half of that pair.
    - name: Aggregate tier sweep with the engine
      working-directory: db
      env:
        GOEXPERIMENT: simd
      run: |
        go mod download
        go test -count=1 -run 'TestAggregateFuzzFixtureSteering|TestAggregateStrategyTierCoverage' ./

  # db/ and changefeed/ are separate Go modules, and the root module's
  # `go test ./...` does not descend into a nested one -- the same reason
  # collections/ has its own job above. They had neither, so the database
  # engine and the change-feed toolkit ran in NO CI job at all: every
  # commit to them was merged on the strength of whatever the author ran
  # locally.
  #
  # What that cost, concretely: db's catalog-timing test wrote two plain
  # maps from OnOpenStep, which the catalog calls concurrently. A real
  # data race, in the tree long enough to be unremarkable, and invisible
  # because no CI had ever pointed the race detector at this module.
  #
  # Both suites are small -- seconds to a minute or so with -race -- so
  # they run unsharded and together. dbrpc/ is far slower and gets its
  # own sharded job below, for the same reason collections does.
  modules:
    name: Module (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      # Each module reports: one failing must not hide a failure in the other.
      fail-fast: false
      matrix:
        module: [db, changefeed]

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        check-latest: true
        go-version: '1.27'

    - name: Install goyacc (version pinned in .github/tools)
      # Built from .github/tools, where the version is pinned and recorded
      # in that module's go.sum. `go install ...@latest` fetched whatever
      # had just been published and verified it against nothing -- a parser
      # generator running with full access to the build. Dependabot bumps
      # it there, under the configured cooldown.
      #
      # GOTOOLCHAIN=auto because x/tools may require a newer Go than the
      # matrix entry building it; the tests below still run on the matrix
      # Go under the inherited GOTOOLCHAIN=local.
      env:
        GOTOOLCHAIN: auto
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        (cd .github/tools && GOWORK=off go build -o "$RUNNER_TEMP/bin/goyacc" golang.org/x/tools/cmd/goyacc)
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    # These modules replace github.com/PelicanPlatform/classad with ../, so they
    # build against the root module in this checkout -- which has no parser until
    # goyacc has run.
    - name: Generate parser
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        goyacc -o parser/y.go -p yy parser/classad.y

    - name: Build and vet
      working-directory: ${{ matrix.module }}
      run: |
        go mod download
        go build ./...
        go vet ./...

    - name: Test (race detector)
      working-directory: ${{ matrix.module }}
      run: go test -race -count=1 ./...

  # dbrpc/ is a separate Go module, and the root module's `go test ./...` does not
  # descend into a nested one -- so the RPC server for the whole database ran in NO CI
  # job at all. A dispatch bug lived there long enough to ship a broken feature
  # downstream: AggregateTable refused an archive table while every other read of the
  # same name accepted one (#242).
  #
  # SHARDED because the suite is ~22 minutes under -race and its cost is concentrated:
  # two tests that build multi-segment archives are 73% of it. Three shards put those in
  # separate jobs, which is all sharding can buy here -- the floor is the slowest single
  # test (~500s), so a fourth shard would idle. See dbrpc/shard-test.sh.
  dbrpc:
    name: dbrpc shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports: one shard failing must not hide a second failure elsewhere.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        check-latest: true
        go-version: '1.27'

    - name: Install goyacc (version pinned in .github/tools)
      # Built from .github/tools, where the version is pinned and recorded
      # in that module's go.sum. `go install ...@latest` fetched whatever
      # had just been published and verified it against nothing -- a parser
      # generator running with full access to the build. Dependabot bumps
      # it there, under the configured cooldown.
      #
      # GOTOOLCHAIN=auto because x/tools may require a newer Go than the
      # matrix entry building it; the tests below still run on the matrix
      # Go under the inherited GOTOOLCHAIN=local.
      env:
        GOTOOLCHAIN: auto
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        (cd .github/tools && GOWORK=off go build -o "$RUNNER_TEMP/bin/goyacc" golang.org/x/tools/cmd/goyacc)
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    # These modules replace github.com/PelicanPlatform/classad with ../, so they
    # build against the root module in this checkout -- which has no parser until
    # goyacc has run.
    - name: Generate parser
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        goyacc -o parser/y.go -p yy parser/classad.y

    - name: Build and vet
      working-directory: dbrpc
      run: |
        go mod download
        go build ./...
        go vet ./...

    - name: Test (race detector)
      working-directory: dbrpc
      env:
        SHARD: ${{ matrix.shard }}
        SHARDS: 3
      run: ./shard-test.sh

  # One check for the whole sharded suite, so a required status check (and anyone reading
  # the PR) has a single "dbrpc module" result rather than three. Without it, adding or
  # removing a shard silently changes which checks exist.
  dbrpc-result:
    name: dbrpc module
    needs: dbrpc
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check shard results
      env:
        RESULT: ${{ needs.dbrpc.result }}
      run: |
        echo "shards: $RESULT"
        # 'success' only when every matrix job succeeded; skipped/cancelled count as
        # failure here, because a suite that did not run is not a suite that passed.
        [ "$RESULT" = "success" ] || exit 1

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        check-latest: true
        go-version: '1.27'

    - name: Install goyacc (version pinned in .github/tools)
      # Built from .github/tools, where the version is pinned and recorded
      # in that module's go.sum. `go install ...@latest` fetched whatever
      # had just been published and verified it against nothing -- a parser
      # generator running with full access to the build. Dependabot bumps
      # it there, under the configured cooldown.
      #
      # GOTOOLCHAIN=auto because x/tools may require a newer Go than the
      # matrix entry building it; the tests below still run on the matrix
      # Go under the inherited GOTOOLCHAIN=local.
      env:
        GOTOOLCHAIN: auto
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        (cd .github/tools && GOWORK=off go build -o "$RUNNER_TEMP/bin/goyacc" golang.org/x/tools/cmd/goyacc)
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Generate parser
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        goyacc -o parser/y.go -p yy parser/classad.y

    - name: Run go vet
      run: go vet ./...

    - name: Run go fmt
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Go code is not formatted:"
          gofmt -s -d .
          exit 1
        fi

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: latest
        skip-cache: true
