name: Tests

on:
  push:
    branches: [ main, develop ]
  # Run on every PR regardless of its base branch, so a stacked PR (one based on
  # another feature branch, not main/develop) still gets CI. Push CI stays scoped to
  # the long-lived branches above.
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.24', '1.25']

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install goyacc
      # goyacc@latest tracks x/tools, whose module now requires a newer Go than the
      # test matrix builds with; setup-go v6+ exports GOTOOLCHAIN=local, which blocks
      # the automatic toolchain switch. Override to auto for this build-tool install
      # only -- the parser generator may build with a newer Go; the tests below still
      # run on the matrix Go under the inherited GOTOOLCHAIN=local.
      env:
        GOTOOLCHAIN: auto
      run: go install golang.org/x/tools/cmd/goyacc@latest

    - name: Generate parser
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        goyacc -o parser/y.go -p yy parser/classad.y

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -v ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage to Codecov
      if: matrix.go-version == '1.23'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  # collections/ is a separate Go module (its own go.mod, go 1.25) — the dense
  # ClassAd store + query engine, the persistent/archive variants, and their tests.
  # The root module's `go test ./...` does not descend into a nested module, so it
  # gets its own job (and a newer toolchain than the root matrix).
  #
  # The suite is SHARDED by test name across parallel jobs. Every test here is `package
  # collections`, so there is one test binary and `go test -p` (which parallelizes across
  # packages) has nothing to work with; the tests do use t.Parallel(), so the suite is
  # core-bound -- ~7min on a 12-core box, ~20min on a 4-vCPU runner, two minutes under the
  # 25m timeout. It went red on one merge commit and green on the next with the same code.
  # Four shards give it the cores one runner does not have, with no test skipped and the
  # race detector still on everywhere. See collections/shard-test.sh.
  collections:
    name: Collections shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports: one shard failing must not hide a second failure elsewhere.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'

    - name: Install goyacc
      # goyacc@latest tracks x/tools, whose module now requires a newer Go than the
      # test matrix builds with; setup-go v6+ exports GOTOOLCHAIN=local, which blocks
      # the automatic toolchain switch. Override to auto for this build-tool install
      # only -- the parser generator may build with a newer Go; the tests below still
      # run on the matrix Go under the inherited GOTOOLCHAIN=local.
      env:
        GOTOOLCHAIN: auto
      run: go install golang.org/x/tools/cmd/goyacc@latest

    - name: Generate parser
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        goyacc -o parser/y.go -p yy parser/classad.y

    - name: Build and vet
      working-directory: collections
      run: |
        go mod download
        go build ./...
        go vet ./...

    # Tests parallelize via t.Parallel(), so each shard also scales across its own runner's
    # cores; the race detector's ~5-10x memory is bounded because the few heaviest tests are
    # sized to a few thousand ads. The script prints its shard sizes and refuses to run a
    # partition that would drop or duplicate a test.
    - name: Test (race detector)
      working-directory: collections
      env:
        SHARD: ${{ matrix.shard }}
        SHARDS: 4
      run: ./shard-test.sh

  # A single check that stays green/red for the whole sharded suite, so a required status
  # check (and anyone reading the PR) has one "Collections module" result to look at rather
  # than four. Without it, adding or removing a shard silently changes which checks exist.
  collections-result:
    name: Collections module
    needs: collections
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check shard results
      env:
        RESULT: ${{ needs.collections.result }}
      run: |
        echo "shards: $RESULT"
        # 'success' only when every matrix job succeeded; skipped/cancelled count as failure
        # here, because a suite that did not run is not a suite that passed.
        [ "$RESULT" = "success" ] || exit 1

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.23'

    - name: Install goyacc
      # goyacc@latest tracks x/tools, whose module now requires a newer Go than the
      # test matrix builds with; setup-go v6+ exports GOTOOLCHAIN=local, which blocks
      # the automatic toolchain switch. Override to auto for this build-tool install
      # only -- the parser generator may build with a newer Go; the tests below still
      # run on the matrix Go under the inherited GOTOOLCHAIN=local.
      env:
        GOTOOLCHAIN: auto
      run: go install golang.org/x/tools/cmd/goyacc@latest

    - name: Generate parser
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        goyacc -o parser/y.go -p yy parser/classad.y

    - name: Run go vet
      run: go vet ./...

    - name: Run go fmt
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Go code is not formatted:"
          gofmt -s -d .
          exit 1
        fi

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: latest
        skip-cache: true
