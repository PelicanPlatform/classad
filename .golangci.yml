version: "2"
run:
  tests: true
linters:
  enable:
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocritic:
      disabled-checks:
        - hugeParam
        - ifElseChain
        - unnamedResult
        - ptrToRefParam
      enabled-tags:
        - diagnostic
        - style
        - performance
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      confidence: 0.8
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
          - govet
          - ineffassign
          - revive
          - staticcheck
          - unconvert
          - unparam
          - unused
        path: parser/y\.go
      - linters:
          - errcheck
          - unparam
        path: _test\.go
      - linters:
          - errcheck
          - gocritic
          - govet
        path: examples/
      - linters:
          - errcheck
        path: classad/evaluator\.go
        text: Error return value of.*Value.*is not checked
      - linters:
          - errcheck
        path: classad/functions\.go
        text: Error return value of.*Value.*is not checked
      - linters:
          - errcheck
        path: classad/matchclassad\.go
        text: Error return value of.*Value.*is not checked
      # gocritic mis-analyzes the cgo preamble in the C++ oracle binding
      # (spurious dupImport/dupSubExpr on the generated `import "C"` glue).
      - linters:
          - gocritic
        path: fuzz/oracle/cgo/
      # Same cgo preamble, same two spurious checks, in the C archive the C++ side
      # links against: cgo rewrites the file before gocritic sees it, so it reports
      # `import "C"` as a duplicate import and misreads the rewritten statements.
      # Every other gocritic check still applies there.
      - linters:
          - gocritic
        path: ^db/capi/
        text: '^(dupImport|uncheckedInlineErr):'
      # govet's shadow check is off in the submodules. It is not part of go
      # vet's default suite, and it is the one check here that flags a style
      # choice rather than a defect: `if err := f(); err != nil` inside a
      # function that already has an `err` is the shape the language
      # encourages. The root module was written with the check on and stays
      # that way. These five modules are separate Go modules that the lint job
      # never entered, so the check never shaped them -- it has 358 hits, and
      # rewriting that much error handling to satisfy a style preference is a
      # far better way to introduce a bug than to find one.
      - linters:
          - govet
        path: ^(changefeed|collections|db|dbrpc|wasmudf)/
        text: '^shadow: '
    paths:
      - bin
      - vendor
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/PelicanPlatform/classad
  exclusions:
    generated: lax
    paths:
      - bin
      - vendor
      - third_party$
      - builtin$
      - examples$
