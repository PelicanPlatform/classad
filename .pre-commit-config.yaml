repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        args: [-w, -s]
      - id: go-vet
      - id: go-imports
        args: [-w]
      - id: go-unit-tests
        args: [-v, -race]
      - id: go-build
      - id: go-mod-tidy

  # Must be built with a Go at least as new as the floor in go.mod:
  # golangci-lint refuses to run otherwise ("the Go language version used
  # to build golangci-lint is lower than the targeted Go version").
  # v2.13.2 is built with go1.27.0.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      - id: golangci-lint
